<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">C source code between large curly braces</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#44403c"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#faf5eb" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><text x="130" y="160" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="190" fill="#fbbf24" text-anchor="middle" font-weight="bold" opacity="0.9">{</text><text x="670" y="160" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="190" fill="#fbbf24" text-anchor="middle" font-weight="bold" opacity="0.9">}</text><text x="230" y="80" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#faf5eb" text-anchor="start">int main(void) {</text><text x="230" y="118" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#a3e635" text-anchor="start">  char *p = kmalloc(64);</text><text x="230" y="156" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#a3e635" text-anchor="start">  p[0] = 'A';</text><text x="230" y="194" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#faf5eb" text-anchor="start">  return 0;</text><text x="230" y="232" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#faf5eb" text-anchor="start">}</text></svg>
