<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">A Unix terminal with a pipeline and a build command</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#44403c"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#faf5eb" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><rect x="80" y="40" width="640" height="220" rx="10" fill="#050b12" stroke="#faf5eb" stroke-width="4"/><rect x="80" y="40" width="640" height="30" rx="10" fill="#fbbf24"/><circle cx="104" cy="55" r="6" fill="#ef4444"/><circle cx="128" cy="55" r="6" fill="#facc15"/><circle cx="152" cy="55" r="6" fill="#22c55e"/><text x="104" y="108" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#faf5eb" text-anchor="start">$ ls -l | grep .c</text><text x="104" y="148" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#faf5eb" text-anchor="start">$ cat kernel.c | wc -l</text><text x="104" y="188" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#a3e635" text-anchor="start" font-weight="bold">$ make &amp;&amp; qemu-system-x86_64</text><text x="104" y="228" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#fbbf24" text-anchor="start">$ _</text></svg>
