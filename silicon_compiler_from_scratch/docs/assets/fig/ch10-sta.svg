<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Timing by hand"><title>Timing by hand</title><rect x="0.5" y="0.5" width="899" height="279" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Static timing on the small check circuit: the longest path is the sum of cell delays (plus clock-to-q and setup)</text><rect x="30.0" y="60.0" width="100.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="80.0" y="84.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">DFF q</text><text x="80.0" y="118.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle">clock-to-q 0.30</text><line x1="132.0" y1="80.0" x2="186.6" y2="80.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="192.0,80.0 183.8,83.7 183.8,76.3" fill="#1f2a37"/><rect x="194.0" y="60.0" width="100.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="244.0" y="84.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">INV</text><text x="244.0" y="118.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2f855a" text-anchor="middle">+ 0.04</text><line x1="296.0" y1="80.0" x2="350.6" y2="80.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="356.0,80.0 347.8,83.7 347.8,76.3" fill="#1f2a37"/><rect x="358.0" y="60.0" width="130.0" height="40.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="423.0" y="84.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">output z</text><text x="423.0" y="118.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#c53030" text-anchor="middle">+ setup 0.10</text><text x="600.0" y="84.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#c53030" text-anchor="start" font-weight="bold">= 0.30 + 0.04 + 0.10 = 0.44 ns</text><rect x="30.0" y="160.0" width="100.0" height="40.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="80.0" y="184.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">a</text><line x1="132.0" y1="180.0" x2="186.6" y2="180.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="192.0,180.0 183.8,183.7 183.8,176.3" fill="#1f2a37"/><rect x="194.0" y="160.0" width="90.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="239.0" y="184.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">INV</text><line x1="286.0" y1="180.0" x2="320.6" y2="180.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="326.0,180.0 317.8,183.7 317.8,176.3" fill="#1f2a37"/><rect x="328.0" y="160.0" width="90.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="373.0" y="184.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">NAND2</text><line x1="420.0" y1="180.0" x2="454.6" y2="180.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="460.0,180.0 451.8,183.7 451.8,176.3" fill="#1f2a37"/><rect x="462.0" y="160.0" width="90.0" height="40.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="507.0" y="184.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">INV</text><line x1="554.0" y1="180.0" x2="588.6" y2="180.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="594.0,180.0 585.8,183.7 585.8,176.3" fill="#1f2a37"/><rect x="596.0" y="160.0" width="80.0" height="40.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="636.0" y="184.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">y</text><text x="690.0" y="178.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#51606f" text-anchor="start">0.04 + 0.07 + 0.04 = 0.15</text><text x="690.0" y="196.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#51606f" text-anchor="start">(+ 0.10 setup = 0.25)</text><text x="450.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">the analyzer prints 0.44 ns at output z: the longer of the paths, as computed here by hand</text></svg>