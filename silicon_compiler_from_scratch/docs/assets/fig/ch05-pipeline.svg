0.0" width="48.0" height="34.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="676.0" y="161.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">w6</text><rect x="652.0" y="200.0" width="48.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="676.0" y="220.8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#1f2a37" text-anchor="middle">s[6]</text><rect x="496.0" y="80.0" width="48.0" height="34.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="520.0" y="101.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">w7</text><rect x="704.0" y="140.0" width="48.0" height="34.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="728.0" y="161.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">w7</text><rect x="704.0" y="200.0" width="48.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="728.0" y="220.8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#1f2a37" text-anchor="middle">s[7]</text><text x="430.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">total = len + latency = 8 + 4 = 12 cycles (plus a few cycles of control), not len x latency = 32</text><text x="430.0" y="282.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">this is why a long transfer is efficient: the latency is paid once</text></svg>