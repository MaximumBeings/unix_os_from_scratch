<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="A pipelined transfer"><title>A pipelined transfer</title><rect x="0.5" y="0.5" width="859" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="430.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">len = 8 words, latency 4: one request per cycle, answers 4 cycles later</text><text x="156.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0</text><text x="208.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1</text><text x="260.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">2</text><text x="312.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">3</text><text x="364.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">4</text><text x="416.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">5</text><text x="468.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">6</text><text x="520.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">7</text><text x="572.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">8</text><text x="624.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">9</text><text x="676.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">10</text><text x="728.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">11</text><text x="780.0" y="54.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">12</text><text x="80.0" y="54.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="end" font-style="italic">cycle</text><text x="80.0" y="100.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#dd6b20" text-anchor="end" font-weight="bold">requests</text><text x="80.0" y="160.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="end" font-weight="bold">answers</text><text x="80.0" y="220.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2b6cb0" text-anchor="end" font-weight="bold">written</text><rect x="132.0" y="80.0" width="48.0" height="34.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="156.0" y="101.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">w0</text><rect x="340.0" y="140.0" width="48.0" height="34.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="364.0" y="161.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">w0</text><rect x="340.0" y="200.0" width="48.0" height="34.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="364.0" y="220.8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#1f2a37" text-anchor="middle">s[0]</text><rect x="184.0" y="80.0" width="48.0" height="34.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="208.0" y="101.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="mi