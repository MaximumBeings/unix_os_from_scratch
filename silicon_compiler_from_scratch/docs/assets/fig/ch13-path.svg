<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="LD then UNPACK"><title>LD then UNPACK</title><rect x="0.5" y="0.5" width="939" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">What the compiler emits for one int4 weight: load the packed words, expand them, release the staging area</text><rect x="30.0" y="90.0" width="170.0" height="80.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="115.0" y="127.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">external memory</text><text x="115.0" y="161.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">n/8 packed words</text><rect x="270.0" y="90.0" width="170.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="355.0" y="127.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">staging area</text><text x="355.0" y="161.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">n/8 words (scratchpad)</text><rect x="510.0" y="90.0" width="170.0" height="80.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="595.0" y="127.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">weight buffer</text><text x="595.0" y="161.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">n int8-valued words</text><rect x="750.0" y="90.0" width="170.0" height="80.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="835.0" y="127.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">MM / RQ as before</text><text x="835.0" y="161.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">operand of the matmul</text><line x1="202.0" y1="130.0" x2="262.6" y2="130.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="268.0,130.0 259.8,133.7 259.8,126.3" fill="#1f2a37"/><line x1="442.0" y1="130.0" x2="502.6" y2="130.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="508.0,130.0 499.8,133.7 499.8,126.3" fill="#1f2a37"/><line x1="682.0" y1="130.0" x2="742.6" y2="130.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="748.0,130.0 739.8,133.7 739.8,126.3" fill="#1f2a37"/><text x="235.0" y="78.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">LD</text><text x="475.0" y="78.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#dd6b20" text-anchor="middle" font-weight="bold">UNPACK</text><text x="470.0" y="230.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#51606f" text-anchor="middle" font-style="italic">The scratchpad has ONE write port: expanding a word takes eight writes, so UNPACK costs at least 8 cycles per word (10 as built).</text><text x="470.0" y="256.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#51606f" text-anchor="middle" font-style="italic">The saving is on the external link only: 8 weights cross it as one word, but all 8 are still written into the scratchpad.</text></svg>