<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="The stack the book builds"><title>The stack the book builds</title><rect x="0.5" y="0.5" width="939" height="469" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The book builds a whole stack, from a model description down to gates, and tests every layer</text><rect x="120.0" y="54.0" width="640.0" height="52.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="440.0" y="77.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A model (a graph of tensor operations)</text><text x="440.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">what the user writes; floating point</text><text x="785.0" y="85.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a0aec0" text-anchor="start" font-weight="bold">Ch 11, 12</text><line x1="440.0" y1="108.0" x2="440.0" y2="110.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="440.0,116.0 436.3,107.8 443.7,107.8" fill="#1f2a37"/><rect x="120.0" y="116.0" width="640.0" height="52.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="440.0" y="139.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Capra, the compiler</text><text x="440.0" y="159.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">scales, tiles, scratchpad addresses, instructions</text><text x="785.0" y="147.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#dd6b20" text-anchor="start" font-weight="bold">Ch 11</text><line x1="440.0" y1="170.0" x2="440.0" y2="172.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="440.0,178.0 436.3,169.8 443.7,169.8" fill="#1f2a37"/><rect x="120.0" y="178.0" width="640.0" height="52.0" rx="8" fill="#fefcbf" stroke="#a0aec0" stroke-width="1.8"/><text x="440.0" y="201.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">GA-2 instructions (128-bit)</text><text x="440.0" y="221.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">LD ST MM RQ SM VADD AMAX HALT (+ UNPACK)</text><text x="785.0" y="209.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#a0aec0" text-anchor="start" font-weight="bold">Ch 7</text><line x1="440.0" y1="232.0" x2="440.0" y2="234.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="440.0,240.0 436.3,231.8 443.7,231.8" fill="#1f2a37"/><rect x="120.0" y="240.0" width="640.0" height="52.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="440.0" y="263.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The chip's units: array, requantizer, softmax, DMA</text><text x="440.0" y="283.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">systolic MACs, int8 arithmetic, exp table, divider, scratchpad</text><text x="785.0" y="271.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">Ch 2-6</text><line x1="440.0" y1="294.0" x2="440.0" y2="296.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="440.0,302.0 436.3,293.8 443.7,293.8" fill="#1f2a37"/><rect x="120.0" y="302.0" width="640.0" height="52.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="440.0" y="325.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Verilog (the RTL)</text><text x="440.0" y="345.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">tested in two simulators against Python golden models</text><text x="785.0" y="333.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#2f855a" text-anchor="start" font-weight="bold">Ch 1-9</text><line x1="440.0" y1="356.0" x2="440.0" y2="358.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="440.0,364.0 436.3,355.8 443.7,355.8" fill="#1f2a37"/><rect x="120.0" y="364.0" width="640.0" height="52.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="440.0" y="387.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Gates (a netlist of library cells)</text><text x="440.0" y="407.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">synthesized, timed, gate-level simulated, fault graded</text><text x="785.0" y="395.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c53030" text-anchor="start" font-weight="bold">Ch 10</text><text x="60.0" y="240.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic" transform="rotate(-90 60.0 240.0)">up: what you want</text><line x1="36.0" y1="400.0" x2="36.0" y2="65.4" stroke="#a0aec0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="36.0,60.0 39.7,68.2 32.3,68.2" fill="#a0aec0"/><text x="470.0" y="440.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#51606f" text-anchor="middle" font-style="italic">Case studies (Part 6) then add modern techniques to the same stack: int4 weights, grouped-query attention, paged KV cache, speculative decoding, mixture of experts</text><text x="470.0" y="458.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">Every layer has its own test, and every test is itself tested by breaking the layer on purpose.</text></svg>