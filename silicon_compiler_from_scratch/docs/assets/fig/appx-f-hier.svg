<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Memory hierarchy"><title>Memory hierarchy</title><rect x="0.5" y="0.5" width="899" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Memories trade size against speed (typical orders of magnitude, assumed)</text><rect x="350.0" y="52.0" width="200.0" height="52.0" rx="8" fill="#fed7d7" stroke="#51606f" stroke-width="1.8"/><text x="450.0" y="75.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">registers</text><text x="450.0" y="95.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">~1 KB, 0 ns</text><rect x="275.0" y="114.0" width="350.0" height="52.0" rx="8" fill="#feebc8" stroke="#51606f" stroke-width="1.8"/><text x="450.0" y="137.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">on-chip SRAM scratchpad</text><text x="450.0" y="157.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">~1-100 MB, 1-10 ns</text><rect x="200.0" y="176.0" width="500.0" height="52.0" rx="8" fill="#dbeafe" stroke="#51606f" stroke-width="1.8"/><text x="450.0" y="199.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">DRAM (DDR / GDDR / HBM)</text><text x="450.0" y="219.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">~10-100 GB, ~50-100 ns</text><rect x="125.0" y="238.0" width="650.0" height="52.0" rx="8" fill="#edf2f7" stroke="#51606f" stroke-width="1.8"/><text x="450.0" y="261.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">flash</text><text x="450.0" y="281.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">~TB, ~100 us</text><line x1="840.0" y1="70.0" x2="840.0" y2="274.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="840.0,280.0 836.3,271.8 843.7,271.8" fill="#1f2a37"/><text x="860.0" y="70.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">faster</text><text x="860.0" y="290.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">larger</text></svg>