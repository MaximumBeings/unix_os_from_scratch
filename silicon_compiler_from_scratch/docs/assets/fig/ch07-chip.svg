<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="GA-2"><title>GA-2</title><rect x="0.5" y="0.5" width="899" height="469" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">GA-2: a sequencer runs one instruction at a time on one of seven units, all sharing one scratchpad</text><rect x="20.0" y="50.0" width="160.0" height="70.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="100.0" y="81.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">program ROM</text><text x="100.0" y="97.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">128-bit instructions</text><rect x="240.0" y="50.0" width="190.0" height="70.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="335.0" y="81.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">sequencer</text><text x="335.0" y="98.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">FETCH - ISSUE - WAIT</text><line x1="182.0" y1="85.0" x2="232.6" y2="85.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="238.0,85.0 229.8,88.7 229.8,81.3" fill="#1f2a37"/><text x="210.0" y="76.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">ins</text><rect x="680.0" y="50.0" width="200.0" height="70.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="780.0" y="74.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">external memory</text><text x="780.0" y="90.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(DRAM model)</text><text x="780.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle" font-style="italic">latency 8 cycles</text><rect x="20.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="76.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">LD</text><text x="76.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">DMA</text><line x1="76.0" y1="256.0" x2="76.0" y2="300.0" stroke="#dd6b20" stroke-width="2.4" stroke-linecap="round"/><rect x="145.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="201.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">ST</text><text x="201.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">store</text><line x1="201.0" y1="256.0" x2="201.0" y2="300.0" stroke="#dd6b20" stroke-width="2.4" stroke-linecap="round"/><rect x="270.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="326.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">MM</text><text x="326.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">4x4 array</text><line x1="326.0" y1="256.0" x2="326.0" y2="300.0" stroke="#2b6cb0" stroke-width="2.4" stroke-linecap="round"/><rect x="395.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="451.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">RQ</text><text x="451.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">requantize</text><line x1="451.0" y1="256.0" x2="451.0" y2="300.0" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round"/><rect x="520.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="576.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">SM</text><text x="576.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">softmax</text><line x1="576.0" y1="256.0" x2="576.0" y2="300.0" stroke="#6b46c1" stroke-width="2.4" stroke-linecap="round"/><rect x="645.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="701.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">VADD</text><text x="701.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">sat. add</text><line x1="701.0" y1="256.0" x2="701.0" y2="300.0" stroke="#2c7a7b" stroke-width="2.4" stroke-linecap="round"/><rect x="770.0" y="190.0" width="112.0" height="64.0" rx="8" fill="#fefcbf" stroke="#a0aec0" stroke-width="1.8"/><text x="826.0" y="220.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">AMAX</text><text x="826.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">argmax</text><line x1="826.0" y1="256.0" x2="826.0" y2="300.0" stroke="#a0aec0" stroke-width="2.4" stroke-linecap="round"/><path d="M335,120 L335,160 L76,160 L76,188" fill="none" stroke="#c53030" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M335,160 L825,160 L825,188" fill="none" stroke="#c53030" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="560.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c53030" text-anchor="middle" font-style="italic">start / done (the sequencer starts exactly one unit and waits for its 'done')</text><rect x="20.0" y="300.0" width="862.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="451.0" y="339.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">scratchpad: 4096 x 32-bit words  (one read port, one write port, 1-cycle read)</text><path d="M143,254 L143,300" fill="none" stroke="#dd6b20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="790.0" y1="124.0" x2="790.0" y2="154.6" stroke="#dd6b20" stroke-width="2.2" stroke-linecap="round"/><polygon points="790.0,160.0 786.3,151.8 793.7,151.8" fill="#dd6b20"/><path d="M790,160 L143,160" fill="none" stroke="#dd6b20" stroke-width="0.01" stroke-linecap="round" stroke-linejoin="round"/><line x1="780.0" y1="125.0" x2="780.0" y2="180.6" stroke="#dd6b20" stroke-width="2" stroke-linecap="round"/><polygon points="780.0,186.0 776.3,177.8 783.7,177.8" fill="#dd6b20"/><text x="860.0" y="150.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#dd6b20" text-anchor="end" font-weight="bold">LD / ST</text><text x="450.0" y="410.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">The unit named by the instruction in flight owns the scratchpad's ports. Nothing runs in parallel:</text><text x="450.0" y="429.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">that is what makes the cycle count of a program the SUM of its instructions' cycle counts, and so predictable.</text></svg>