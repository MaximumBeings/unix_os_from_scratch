<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" role="img" aria-label="Tiling an 8 x 8 product on a 4 x 4 array"><title>Tiling an 8 x 8 product on a 4 x 4 array</title><rect x="0.5" y="0.5" width="859" height="369" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="430.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A 4 x 4 array computes an 8 x 8 result as four tiles, one after another (Running example B)</text><text x="110.0" y="60.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">C (8 x 8)</text><rect x="40.0" y="72.0" width="66.0" height="66.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="73.0" y="109.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 0</text><rect x="110.0" y="72.0" width="66.0" height="66.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="143.0" y="109.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 1</text><rect x="40.0" y="142.0" width="66.0" height="66.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="73.0" y="179.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 2</text><rect x="110.0" y="142.0" width="66.0" height="66.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="143.0" y="179.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 3</text><text x="500.0" y="60.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">time on the 4 x 4 array (cycles)</text><rect x="220.0" y="90.0" width="146.0" height="44.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="293.0" y="116.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 0: 14 cycles</text><text x="220.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">0</text><line x1="293.0" y1="134.0" x2="293.0" y2="144.6" stroke="#2b6cb0" stroke-width="1.6" stroke-linecap="round"/><polygon points="293.0,150.0 289.3,141.8 296.7,141.8" fill="#2b6cb0"/><rect x="370.0" y="90.0" width="146.0" height="44.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="443.0" y="116.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 1: 14 cycles</text><text x="370.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">14</text><line x1="443.0" y1="134.0" x2="443.0" y2="144.6" stroke="#2f855a" stroke-width="1.6" stroke-linecap="round"/><polygon points="443.0,150.0 439.3,141.8 446.7,141.8" fill="#2f855a"/><rect x="520.0" y="90.0" width="146.0" height="44.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="593.0" y="116.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 2: 14 cycles</text><text x="520.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">28</text><line x1="593.0" y1="134.0" x2="593.0" y2="144.6" stroke="#dd6b20" stroke-width="1.6" stroke-linecap="round"/><polygon points="593.0,150.0 589.3,141.8 596.7,141.8" fill="#dd6b20"/><rect x="670.0" y="90.0" width="146.0" height="44.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="743.0" y="116.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile 3: 14 cycles</text><text x="670.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start">42</text><line x1="743.0" y1="134.0" x2="743.0" y2="144.6" stroke="#6b46c1" stroke-width="1.6" stroke-linecap="round"/><polygon points="743.0,150.0 739.3,141.8 746.7,141.8" fill="#6b46c1"/><text x="820.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="end">56</text><text x="430.0" y="236.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">each tile: 8 + 2x4 - 2 = 14 cycles (8 of useful work per PE + 6 cycles of fill and drain)</text><text x="430.0" y="256.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">4 tiles x 14 = 56 cycles (measured);  ideal with no fill or drain would be 4 x 8 = 32;  utilization 32/56 = 0.571</text><rect x="40.0" y="276.0" width="780.0" height="74.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="430.0" y="298.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">Tile (r, c) needs rows 4r..4r+3 of A and columns 4c..4c+3 of B: every tile reads ALL K = 8 values of its rows and columns.</text><text x="430.0" y="317.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">On an 8 x 8 array the same product is one tile of 22 cycles (utilization 0.364): 4x the PEs, 2.5x the speed.</text><text x="430.0" y="336.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">Chapter 7's matrix unit does exactly this tile loop for you; Chapter 11's compiler chooses the tiles.</text></svg>