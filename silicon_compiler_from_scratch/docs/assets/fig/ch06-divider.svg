ly="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">Result: quotient 4 (= 00100), remainder 2.  22 = 4 x 5 + 2.</text><text x="430.0" y="329.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">The real divider does the same with 40 bits in 40 clocks: shift, compare, subtract, write one quotient bit.</text></svg>