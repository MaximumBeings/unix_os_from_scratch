<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Bank occupancy"><title>Bank occupancy</title><rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">What each scratchpad bank is doing over time (double-buffered run): the banks take turns</text><text x="90.0" y="90.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="end" font-weight="bold">bank 0</text><text x="90.0" y="170.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="end" font-weight="bold">bank 1</text><rect x="100.0" y="70.0" width="101.2" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="150.6" y="91.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">loading tile 0</text><rect x="201.2" y="70.0" width="154.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="278.2" y="91.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">computing tile 0</text><rect x="201.2" y="150.0" width="101.2" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="251.8" y="171.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">loading tile 1</text><rect x="355.2" y="150.0" width="154.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="432.2" y="171.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">computing tile 1</text><rect x="355.2" y="70.0" width="101.2" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="405.8" y="91.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">loading tile 2</text><rect x="509.2" y="70.0" width="154.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="586.2" y="91.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">computing tile 2</text><rect x="509.2" y="150.0" width="101.2" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="559.8" y="171.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">loading tile 3</text><rect x="663.2" y="150.0" width="154.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="740.2" y="171.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle" font-weight="bold">computing tile 3</text><text x="450.0" y="240.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">A bank is loaded, then computed on, then free again. Bank 0 holds tiles 0 and 2, bank 1 holds tiles 1 and 3.</text><text x="450.0" y="258.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">The controller's two rules are visible here: a load never starts in a bank that is still being computed on,</text><text x="450.0" y="276.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">and a compute never starts before its bank has been completely loaded.</text></svg>