<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-label="A full adder as gates: 2 XORs and 3 NANDs"><title>A full adder as gates: 2 XORs and 3 NANDs</title><rect x="0.5" y="0.5" width="699" height="349" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="350.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Full adder as gates: sum = a XOR b XOR cin;  cout = (a AND b) OR (cin AND (a XOR b))</text><path d="M170,50 C194.2,50 207.4,56.8 214,67.0 C207.4,77.2 194.2,84 170,84 C181.0,75.5 181.0,58.5 170,50 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M163,50 C177.92,58.5 177.92,75.5 163,84" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="189.8" y="71.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#51606f" text-anchor="middle">XOR</text><path d="M133.0,59.5 L167.0,59.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="127.0" y="64.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">a</text><path d="M133.0,74.5 L167.0,74.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="127.0" y="79.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">b</text><path d="M400,70 C424.2,70 437.4,76.8 444,87.0 C437.4,97.2 424.2,104 400,104 C411.0,95.5 411.0,78.5 400,70 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M393,70 C407.92,78.5 407.92,95.5 393,104" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="419.8" y="91.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#51606f" text-anchor="middle">XOR</text><path d="M214.0,67.0 L320.0,67.0 L320.0,79.5 L397.0,79.5" fill="none" stroke="#dd6b20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="300.0" y="59.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#dd6b20" text-anchor="middle" font-weight="bold">p</text><path d="M363.0,94.5 L397.0,94.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="357.0" y="99.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">cin</text><path d="M444.0,87.0 L560.0,87.0" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="570.0" y="92.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="start" font-weight="bold">sum</text><path d="M170,200 L192.0,200 A22.0,17.0 0 0 1 192.0,234 L170,234 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="217.5" cy="217.0" r="3.5" fill="#ffffff" stroke="#1f2a37" stroke-width="1.6"/><text x="189.8" y="221.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#51606f" text-anchor="middle">NAND</text><path d="M136.0,209.5 L170.0,209.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130.0" y="214.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">a</text><path d="M136.0,224.5 L170.0,224.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="130.0" y="229.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">b</text><path d="M400,250 L422.0,250 A22.0,17.0 0 0 1 422.0,284 L400,284 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="447.5" cy="267.0" r="3.5" fill="#ffffff" stroke="#1f2a37" stroke-width="1.6"/><text x="419.8" y="271.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#51606f" text-anchor="middle">NAND</text><path d="M366.0,259.5 L400.0,259.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360.0" y="264.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#dd6b20" text-anchor="end" font-weight="bold">p</text><path d="M366.0,274.5 L400.0,274.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360.0" y="279.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="end" font-weight="bold">cin</text><path d="M560,205 L582.0,205 A22.0,17.0 0 0 1 582.0,239 L560,239 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="607.5" cy="222.0" r="3.5" fill="#ffffff" stroke="#1f2a37" stroke-width="1.6"/><text x="579.8" y="226.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#51606f" text-anchor="middle">NAND</text><path d="M221.0,217.0 L520.0,217.0 L520.0,214.5 L560.0,214.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M451.0,267.0 L520.0,267.0 L520.0,229.5 L560.0,229.5" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M611.0,222.0 L660.0,222.0" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="668.0" y="227.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="start" font-weight="bold">cout</text><text x="240.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">NAND(a, b)</text><text x="422.0" y="300.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">NAND(p, cin)</text><text x="590.0" y="262.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">NAND of the two</text><text x="350.0" y="322.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">Three NANDs make an OR of two ANDs: NAND(NAND(x,y), NAND(z,w)) = (x AND y) OR (z AND w).</text><text x="350.0" y="337.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">That is Yosys's result for each stage: 2 XORs + 3 NANDs.</text></svg>