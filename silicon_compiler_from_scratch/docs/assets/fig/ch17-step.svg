<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" role="img" aria-label="A step is two programs"><title>A step is two programs</title><rect x="0.5" y="0.5" width="939" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One decode step of the mixture-of-experts model: two programs and a decision in between</text><rect x="30.0" y="100.0" width="220.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="140.0" y="157.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">program A</text><text x="140.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">attention, residual, router</text><rect x="690.0" y="100.0" width="220.0" height="120.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="800.0" y="157.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">program B_e</text><text x="800.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">expert e, residual, output</text><rect x="330.0" y="112.0" width="280.0" height="96.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="470.0" y="157.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">host: dispatch</text><text x="470.0" y="199.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">read