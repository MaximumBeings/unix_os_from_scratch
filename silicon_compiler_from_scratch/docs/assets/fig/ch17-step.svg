<text x="506.0" y="317.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#51606f" text-anchor="middle" font-style="italic">not touched</text><rect x="546.0" y="270.0" width="64.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="578.0" y="294.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle">expert 3</text><text x="578.0" y="317.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="8" fill="#51606f" text-anchor="middle" font-style="italic">not touched</text><line x1="470.0" y1="210.0" x2="436.6" y2="262.0" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round"/><polygon points="434.0,266.0 435.2,258.1 440.7,261.6" fill="#dd6b20"/><text x="470.0" y="360.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">The chip has no branch instruction: the choice of expert is made by the host between two programs. The experts that are not chosen are never loaded.</text></svg>