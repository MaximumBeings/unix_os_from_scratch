<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Batching shares the weights"><title>Batching shares the weights</title><rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One matrix product with M = B rows reads the weights once for B requests</text><rect x="30.0" y="70.0" width="130.0" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="95.0" y="92.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">x of request 0</text><rect x="190.0" y="60.0" width="160.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="270.0" y="131.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">weights W</text><text x="270.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">(read once)</text><line x1="162.0" y1="88.0" x2="184.6" y2="115.8" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="188.0,120.0 180.0,115.9 185.7,111.3" fill="#1f2a37"/><rect x="380.0" y="70.0" width="130.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="445.0" y="92.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">q of request 0</text><line x1="352.0" y1="120.0" x2="374.5" y2="94.1" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="378.0,90.0 375.4,98.6 369.8,93.8" fill="#1f2a37"/><text x="190.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">B = 1: M = 1, intensity ~ 1 MAC/word</text><rect x="560.0" y="54.0" width="90.0" height="32.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="605.0" y="73.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">x of req 0</text><rect x="560.0" y="92.0" width="90.0" height="32.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="605.0" y="111.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">x of req 1</text><rect x="560.0" y="130.0" width="90.0" height="32.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="605.0" y="149.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">x of req 2</text><rect x="560.0" y="168.0" width="90.0" height="32.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="605.0" y="187.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">x of req 3</text><rect x="660.0" y="60.0" width="120.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="720.0" y="131.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">weights W</text><text x="720.0" y="147.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(read ONCE)</text><line x1="652.0" y1="135.0" x2="652.6" y2="135.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="658.0,135.0 649.8,138.7 649.8,131.3" fill="#1f2a37"/><rect x="795.0" y="70.0" width="90.0" height="120.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="840.0" y="119.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">q of</text><text x="840.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">requests</text><text x="840.0" y="149.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">0 to 3</text><line x1="782.0" y1="130.0" x2="787.6" y2="130.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="793.0,130.0 784.8,133.7 784.8,126.3" fill="#1f2a37"/><text x="700.0" y="245.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">B = 4: M = 4, intensity up to 4x</text><text x="450.0" y="300.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">Attention cannot be shared: request k's scores read only request k's own KV cache, so that traffic adds up with B.</text></svg>