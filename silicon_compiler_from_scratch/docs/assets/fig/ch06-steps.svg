<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Softmax in five steps"><title>Softmax in five steps</title><rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The five steps of the integer softmax, with the numbers of Running example A</text><rect x="14.0" y="50.0" width="160.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="94.0" y="75.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">1 maximum</text><text x="94.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">m = 32</text><line x1="176.0" y1="78.0" x2="182.6" y2="78.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="188.0,78.0 179.8,81.7 179.8,74.3" fill="#1f2a37"/><rect x="190.0" y="50.0" width="160.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="270.0" y="75.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">2 lookup</text><text x="270.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">e = T[m - x]</text><line x1="352.0" y1="78.0" x2="358.6" y2="78.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="364.0,78.0 355.8,81.7 355.8,74.3" fill="#1f2a37"/><rect x="366.0" y="50.0" width="160.0" height="56.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="446.0" y="75.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">3 sum</text><text x="446.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">s = sum e</text><line x1="528.0" y1="78.0" x2="534.6" y2="78.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="540.0,78.0 531.8,81.7 531.8,74.3" fill="#1f2a37"/><rect x="542.0" y="50.0" width="160.0" height="56.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="622.0" y="75.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">4 divide once</text><text x="622.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">r = 2^38 / s</text><line x1="704.0" y1="78.0" x2="710.6" y2="78.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="716.0,78.0 707.8,81.7 707.8,74.3" fill="#1f2a37"/><rect x="718.0" y="50.0" width="160.0" height="56.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="798.0" y="75.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">5 scale</text><text x="798.0" y="97.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">p = e*r &gt;&gt; 22</text><text x="60.0" y="150.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle"></text><text x="150.0" y="159.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#51606f" text-anchor="end" font-weight="bold">x (scores)</text><rect x="170.0" y="135.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="225.0" y="159.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">32</text><rect x="290.0" y="135.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="345.0" y="159.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">16</text><rect x="410.0" y="135.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="465.0" y="159.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">0</text><rect x="530.0" y="135.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="585.0" y="159.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">-16</text><text x="150.0" y="209.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#51606f" text-anchor="end" font-weight="bold">d = m - x</text><rect x="170.0" y="185.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="225.0" y="209.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">0</text><rect x="290.0" y="185.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="345.0" y="209.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">16</text><rect x="410.0" y="185.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="465.0" y="209.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">32</text><rect x="530.0" y="185.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="585.0" y="209.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">48</text><text x="150.0" y="259.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#51606f" text-anchor="end" font-weight="bold">e = T[d]</text><rect x="170.0" y="235.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="225.0" y="259.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">65535</text><rect x="290.0" y="235.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="345.0" y="259.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">24109</text><rect x="410.0" y="235.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="465.0" y="259.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">8869</text><rect x="530.0" y="235.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="585.0" y="259.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">3263</text><text x="150.0" y="309.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#51606f" text-anchor="end" font-weight="bold">p (Q0.16)</text><rect x="170.0" y="285.0" width="110.0" height="38.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="225.0" y="309.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">42200</text><rect x="290.0" y="285.0" width="110.0" height="38.0" r