<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Inside the requantizer"><title>Inside the requantizer</title><rect x="0.5" y="0.5" width="859" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="430.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">rtl/requant.v, step by step (all combinational)</text><rect x="14.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="73.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">|acc|</text><text x="73.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">negate if acc &lt; 0</text><text x="73.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">32 bits</text><line x1="134.0" y1="105.0" x2="146.6" y2="105.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="152.0,105.0 143.8,108.7 143.8,101.3" fill="#1f2a37"/><rect x="154.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="213.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">x m</text><text x="213.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">32 x 24 multiply</text><text x="213.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">up to 56 bits</text><line x1="274.0" y1="105.0" x2="286.6" y2="105.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="292.0,105.0 283.8,108.7 283.8,101.3" fill="#1f2a37"/><rect x="294.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="353.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">+ 2^(s-1)</text><text x="353.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">half a unit of the</text><text x="353.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">last kept bit</text><text x="353.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">57 bits</text><line x1="414.0" y1="105.0" x2="426.6" y2="105.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="432.0,105.0 423.8,108.7 423.8,101.3" fill="#1f2a37"/><rect x="434.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="493.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">&gt;&gt; s</text><text x="493.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">shift right by s</text><text x="493.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">drops the fraction</text><line x1="554.0" y1="105.0" x2="566.6" y2="105.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="572.0,105.0 563.8,108.7 563.8,101.3" fill="#1f2a37"/><rect x="574.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="633.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">clamp</text><text x="633.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">magnitude to 127</text><text x="633.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">7 bits</text><line x1="694.0" y1="105.0" x2="706.6" y2="105.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="712.0,105.0 703.8,108.7 703.8,101.3" fill="#1f2a37"/><rect x="714.0" y="70.0" width="118.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="773.0" y="110.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">sign, relu</text><text x="773.0" y="164.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">restore sign;</text><text x="773.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">relu zeroes negatives</text><text x="773.0" y="206.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b46c1" text-anchor="middle" font-style="italic">int8</text><text x="430.0" y="56.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#51606f" text-anchor="middle" font-style="italic">acc (int32), m (24 bit), s (6 bit), relu  -&gt;  q (int8)</text><text x="430.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">Rounding the MAGNITUDE (steps 1-4) and putting the sign back at the end gives ties-away-from-zero and requant(-x) = -requant(x).</text><text x="430.0" y="268.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">Adding 2^(s-1) before the shift is how 'round to nearest' is done with a shift: the +half pushes anything at or above .5 up to the next integer.</text><text x="430.0" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#dd6b20" text-anchor="middle" font-style="italic">orange = the two steps whose mistakes the mutation table catches most often (rounding constant, clamp limit)</text></svg>