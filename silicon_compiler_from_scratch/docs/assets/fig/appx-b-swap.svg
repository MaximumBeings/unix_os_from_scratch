<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Blocking and non-blocking"><title>Blocking and non-blocking</title><rect x="0.5" y="0.5" width="939" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">a &lt;= b; b &lt;= a   against   a = b; b = a   (a = 1, b = 2 before the clock edge)</text><rect x="30.0" y="60.0" width="420.0" height="200.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="240.0" y="88.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">non-blocking (&lt;=): both right-hand sides are read first</text><rect x="70.0" y="110.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="240.0" y="132.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle">read b (2) and a (1)</text><rect x="70.0" y="158.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="240.0" y="180.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle">then a gets 2, b gets 1</text><rect x="70.0" y="206.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="240.0" y="228.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">result: a = 2, b = 1  (a swap)</text><rect x="480.0" y="60.0" width="420.0" height="200.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="690.0" y="88.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">blocking (=): statements run one after the other</text><rect x="520.0" y="110.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.8"/><text x="690.0" y="132.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle">a = b  -&gt;  a is now 2</text><rect x="520.0" y="158.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.8"/><text x="690.0" y="180.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle">b = a  -&gt;  reads the NEW a (2)</text><rect x="520.0" y="206.0" width="340.0" height="36.0" rx="8" fill="#ffffff" stroke="#c53030" stroke-width="1.8"/><text x="690.0" y="228.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">result: a = 2, b = 2  (a bug)</text><text x="470.0" y="305.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">In clocked always blocks write &lt;=; use = only inside combinational blocks. Appendix B shows both in the same testbench.</text></svg>