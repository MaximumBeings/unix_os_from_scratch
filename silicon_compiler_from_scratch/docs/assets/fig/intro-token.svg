<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="A token's journey"><title>A token's journey</title><rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One generated token touches every chapter: the book in a single decode step</text><rect x="14.0" y="56.0" width="212.0" height="64.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="120.0" y="85.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">host: embedding row</text><text x="120.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 12</text><line x1="228.0" y1="88.0" x2="234.6" y2="88.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="240.0,88.0 231.8,91.7 231.8,84.3" fill="#1f2a37"/><rect x="242.0" y="56.0" width="212.0" height="64.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="348.0" y="85.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">LD: DMA brings weights in</text><text x="348.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 5</text><line x1="456.0" y1="88.0" x2="462.6" y2="88.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="468.0,88.0 459.8,91.7 459.8,84.3" fill="#1f2a37"/><rect x="470.0" y="56.0" width="212.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="576.0" y="85.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">MM: int8 matrix products</text><text x="576.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 2-4</text><line x1="684.0" y1="88.0" x2="690.6" y2="88.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="696.0,88.0 687.8,91.7 687.8,84.3" fill="#1f2a37"/><rect x="698.0" y="56.0" width="212.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="804.0" y="85.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">RQ: back to int8</text><text x="804.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 3</text><rect x="14.0" y="156.0" width="212.0" height="64.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="120.0" y="185.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">append k, v to the KV cache</text><text x="120.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 8</text><line x1="228.0" y1="188.0" x2="234.6" y2="188.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="240.0,188.0 231.8,191.7 231.8,184.3" fill="#1f2a37"/><rect x="242.0" y="156.0" width="212.0" height="64.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="348.0" y="185.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">SM: softmax</text><text x="348.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 6</text><line x1="456.0" y1="188.0" x2="462.6" y2="188.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="468.0,188.0 459.8,191.7 459.8,184.3" fill="#1f2a37"/><rect x="470.0" y="156.0" width="212.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="576.0" y="185.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">MM + RQ: sum, feed-forward</text><text x="576.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 3, 4, 8</text><line x1="684.0" y1="188.0" x2="690.6" y2="188.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="696.0,188.0 687.8,191.7 687.8,184.3" fill="#1f2a37"/><rect x="698.0" y="156.0" width="212.0" height="64.0" rx="8" fill="#fefcbf" stroke="#a0aec0" stroke-width="1.8"/><text x="804.0" y="185.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">AMAX: pick the next token</text><text x="804.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" fill="#51606f" text-anchor="middle" font-style="italic">Ch 7</text><text x="470.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">The steps above are the instructions of a program written by Capra (Ch 11), run by the sequencer (Ch 7)</text><text x="470.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">on Verilog (Ch 1-6) that synthesizes to gates (Ch 10), at a speed set by memory traffic (Ch 9).</text><text x="470.0" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">The output token is fed back as the next input, and the loop repeats</text></svg>