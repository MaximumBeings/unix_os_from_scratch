<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-label="Mutation testing"><title>Mutation testing</title><rect x="0.5" y="0.5" width="779" height="359" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="390.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Mutation testing: break the circuit on purpose and see whether the test notices</text><rect x="20.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="85.0" y="176.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">circuit.v</text><text x="85.0" y="193.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">(correct)</text><line x1="152.0" y1="180.0" x2="191.9" y2="83.0" stroke="#c53030" stroke-width="1.8" stroke-linecap="round"/><polygon points="194.0,78.0 194.3,87.0 187.5,84.2" fill="#c53030"/><rect x="196.0" y="50.0" width="246.0" height="56.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="319.0" y="82.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">mutant A: carry-in tied to 0</text><line x1="444.0" y1="78.0" x2="487.8" y2="175.1" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round"/><polygon points="490.0,180.0 483.3,174.0 490.0,171.0" fill="#1f2a37"/><line x1="152.0" y1="180.0" x2="188.6" y2="178.3" stroke="#c53030" stroke-width="1.8" stroke-linecap="round"/><polygon points="194.0,178.0 186.0,182.1 185.6,174.7" fill="#c53030"/><rect x="196.0" y="150.0" width="246.0" height="56.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="319.0" y="182.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Aria