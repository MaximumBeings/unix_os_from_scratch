<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Software versus hardware description"><title>Software versus hardware description</title><rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A program runs one statement after another; a hardware description is many things happening at once</text><rect x="30.0" y="50.0" width="400.0" height="200.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="230.0" y="74.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">software (C, Python)</text><text x="50.0" y="104.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">x = a + b;</text><text x="50.0" y="126.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">y = x * 2;</text><text x="50.0" y="148.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">z = y - 1;</text><text x="230.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">one after the other: z needs y needs x</text><text x="230.0" y="214.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">time is the order of statements</text><rect x="470.0" y="50.0" width="400.0" height="200.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="670.0" y="74.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#2b6cb0" text-anchor="middle" font-weight="bold">hardware (Verilog)</text><text x="490.0" y="104.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">assign x = a + b;</text><text x="490.0" y="126.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">assign y = x * 2;</text><text x="490.0" y="148.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">assign z = y - 1;</text><text x="670.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">three circuits that all exist and all run, always</text><text x="670.0" y="214.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">the order of lines does not matter; time is the clock</text></svg>