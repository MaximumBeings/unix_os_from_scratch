<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Verilog map"><title>Verilog map</title><rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">What the pieces of a Verilog module become in hardware</text><rect x="30.0" y="50.0" width="320.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="190.0" y="72.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">module / ports</text><line x1="352.0" y1="68.0" x2="375.8" y2="68.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,68.0 373.6,70.9 373.6,65.1" fill="#1f2a37"/><rect x="384.0" y="50.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/><text x="649.0" y="72.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">a box with named wires in and out</text><rect x="30.0" y="94.0" width="320.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="190.0" y="116.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">assign y = a &amp; b;</text><line x1="352.0" y1="112.0" x2="375.8" y2="112.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,112.0 373.6,114.9 373.6,109.1" fill="#1f2a37"/><rect x="384.0" y="94.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="649.0" y="116.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">combinational logic: y follows a and b at all times</text><rect x="30.0" y="138.0" width="320.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="190.0" y="160.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">always @* begin ... end</text><line x1="352.0" y1="156.0" x2="375.8" y2="156.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,156.0 373.6,158.9 373.6,153.1" fill="#1f2a37"/><rect x="384.0" y="138.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="649.0" y="160.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">combinational logic, written as a small program (assign EVERY output on EVERY path)</text><rect x="30.0" y="182.0" width="320.0" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="190.0" y="204.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">always @(posedge clk) q &lt;= d;</text><line x1="352.0" y1="200.0" x2="375.8" y2="200.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,200.0 373.6,202.9 373.6,197.1" fill="#1f2a37"/><rect x="384.0" y="182.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#dd6b20" stroke-width="1.8"/><text x="649.0" y="204.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">flip-flops: q updates at each rising clock edge</text><rect x="30.0" y="226.0" width="320.0" height="36.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="190.0" y="248.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">reg / wire</text><line x1="352.0" y1="244.0" x2="375.8" y2="244.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,244.0 373.6,246.9 373.6,241.1" fill="#1f2a37"/><rect x="384.0" y="226.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="649.0" y="248.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">a name for a signal; reg does NOT mean 'register' by itself</text><rect x="30.0" y="270.0" width="320.0" height="36.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="190.0" y="292.4" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">module instance</text><line x1="352.0" y1="288.0" x2="375.8" y2="288.0" stroke="#1f2a37" stroke-width="1.6" stroke-linecap="round"/><polygon points="380.0,288.0 373.6,290.9 373.6,285.1" fill="#1f2a37"/><rect x="384.0" y="270.0" width="530.0" height="36.0" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8"/><text x="649.0" y="292.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">a copy of a box wired into a bigger box</text></svg>