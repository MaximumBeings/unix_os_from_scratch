<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-label="Compute, scratchpad, DMA and DRAM"><title>Compute, scratchpad, DMA and DRAM</title><rect x="0.5" y="0.5" width="859" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="430.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Where the data lives: slow and big outside, fast and small inside</text><rect x="20.0" y="100.0" width="150.0" height="120.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="95.0" y="149.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">external memory</text><text x="95.0" y="166.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">(DRAM)</text><text x="95.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">big, slow: ~100 cycles</text><rect x="260.0" y="120.0" width="120.0" height="80.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="320.0" y="157.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">DMA engine</text><text x="320.0" y="191.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">copies blocks</text><rect x="470.0" y="80.0" width="150.0" height="160.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="2"/><text x="545.0" y="102.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#2f855a" text-anchor="middle" font-weight="bold">scratchpad</text><rect x="484.0" y="116.0" width="122.0" height="50.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="545.0" y="145.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">bank 0</text><rect x="484.0" y="176.0" width="122.0" height="50.0" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/><text x="545.0" y="205.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">bank 1</text><rect x="710.0" y="100.0" width="130.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="775.0" y="141.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">compute</text><text x="775.0" y="157.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(systolic array,</text><text x="775.0" y="173.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">vector units)</text><text x="775.0" y="211.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" fill="#51606f" text-anchor="middle" font-style="italic">1 word / cycle</text><line x1="172.0" y1="160.0" x2="252.6" y2="160.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="258.0,160.0 249.8,163.7 249.8,156.3" fill="#1f2a37"/><text x="215.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">requests</text><line x1="382.0" y1="160.0" x2="462.6" y2="160.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="468.0,160.0 459.8,163.7 459.8,156.3" fill="#1f2a37"/><text x="425.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">answers</text><line x1="622.0" y1="160.0" x2="702.6" y2="160.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="708.0,160.0 699.8,163.7 699.8,156.3" fill="#1f2a37"/><text x="430.0" y="276.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">The DMA fills one bank while the compute unit works on the other: that is double buffering.</text><text x="430.0" y="295.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">The program, not the hardware, decides what lives in the scratchpad (unlike a cache, which guesses).</text></svg>