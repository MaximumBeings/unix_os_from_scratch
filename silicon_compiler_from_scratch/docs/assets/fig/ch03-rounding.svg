.0" y1="94.0" x2="644.0" y2="106.6" stroke="#2f855a" stroke-width="1.8" stroke-linecap="round"/><polygon points="644.0,112.0 640.3,103.8 647.7,103.8" fill="#2f855a"/><rect x="612.0" y="114.0" width="64.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="644.0" y="137.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">+2</text><line x1="644.0" y1="152.0" x2="644.0" y2="166.6" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round"/><polygon points="644.0,172.0 640.3,163.8 647.7,163.8" fill="#dd6b20"/><rect x="612.0" y="174.0" width="64.0" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="644.0" y="197.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">+2</text><rect x="690.0" y="56.0" width="64.0" height="36.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="722.0" y="78.9" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">+2.5</text><line x1="722.0" y1="94.0" x2="722.0" y2="106.6" stroke="#2f855a" stroke-width="1.8" stroke-linecap="round"/><polygon points="722.0,112.0 718.3,103.8 725.7,103.8" fill="#2f855a"/><rect x="690.0" y="114.0" width="64.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="722.0" y="137.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">+3</text><line x1="722.0" y1="152.0" x2="722.0" y2="166.6" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round"/><polygon points="722.0,172.0 718.3,163.8 725.7,163.8" fill="#dd6b20"/><rect x="690.0" y="174.0" width="64.0" height="36.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="722.0" y="197.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">+2</text><text x="390.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">Away from zero is symmetric (requant(-x) = -requant(x)) and cheap: round the magnitude.</text><text x="390.0" y="268.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">Nearest-even removes a tiny bias but needs a sticky-bit comparison; this chip does not use it. Either works if everyone agrees.</text></svg>