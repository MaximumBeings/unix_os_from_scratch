<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="The int8 layer pipeline"><title>The int8 layer pipeline</title><rect x="0.5" y="0.5" width="859" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="430.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One layer: int8 x int8 -&gt; exact int32 -&gt; requantizer -&gt; int8 (numbers from Running example A)</text><rect x="20.0" y="56.0" width="140.0" height="70.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="90.0" y="88.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">real X, W</text><text x="90.0" y="117.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">floats</text><rect x="190.0" y="56.0" width="140.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="260.0" y="88.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">quantize</text><text x="260.0" y="117.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">q = round(x/scale)</text><rect x="360.0" y="56.0" width="140.0" height="70.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="430.0" y="88.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">int8 matmul</text><text x="430.0" y="117.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">acc = sum Xq * Wq</text><rect x="530.0" y="56.0" width="140.0" height="70.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="600.0" y="88.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">requantizer</text><text x="600.0" y="117.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">q = round(acc * m / 2^s)</text><rect x="700.0" y="56.0" width="140.0" height="70.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="770.0" y="88.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">int8 output</text><text x="770.0" y="117.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#51606f" text-anchor="middle" font-style="italic">scale_out</text><line x1="162.0" y1="91.0" x2="182.6" y2="91.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="188.0,91.0 179.8,94.7 179.8,87.3" fill="#1f2a37"/><line x1="332.0" y1="91.0" x2="352.6" y2="91.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="358.0,91.0 349.8,94.7 349.8,87.3" fill="#1f2a37"/><line x1="502.0" y1="91.0" x2="522.6" y2="91.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="528.0,91.0 519.8,94.7 519.8,87.3" fill="#1f2a37"/><line x1="672.0" y1="91.0" x2="692.6" y2="91.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="698.0,91.0 689.8,94.7 689.8,87.3" fill="#1f2a37"/><text x="260.0" y="152.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#51606f" text-anchor="middle">Xq = [[32, -64, 95], [127, 16, -48]]</text><text x="260.0" y="168.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#51606f" text-anchor="middle">Wq = [[127, -42], [-64, 95], [32, -116]]</text><text x="430.0" y="152.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#1f2a37" text-anchor="middle"></text><text x="430.0" y="200.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#2f855a" text-anchor="middle" font-weight="bold">acc = [[11200, -18444], [13569, 1754]]   (32-bit, exact)</text><text x="430.0" y="232.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#dd6b20" text-anchor="middle" font-weight="bold">M = scale_x x scale_w / scale_out = 0.00687  ~  m / 2^s,   m = 14757225, s = 31</text><text x="430.0" y="264.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#6b46c1" text-anchor="middle" font-weight="bold">q = [[77, -127], [93, 12]]   (int8)  -&gt;  real = q x scale_out = [[1.67, -2.75], [2.01, 0.26]]</text><text x="430.0" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#51606f" text-anchor="middle" font-style="italic">The scales are bookkeeping: the chip only ever sees the integers Xq, Wq, m, s.</text></svg>