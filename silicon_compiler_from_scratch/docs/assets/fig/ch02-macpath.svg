<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-label="The MAC datapath"><title>The MAC datapath</title><rect x="0.5" y="0.5" width="779" height="389" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="390.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One MAC cell: multiply, add to the accumulator, clamp or wrap, store</text><text x="40.0" y="80.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start" font-weight="bold">a (int8)</text><text x="40.0" y="130.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start" font-weight="bold">b (int8)</text><line x1="112.0" y1="76.0" x2="172.8" y2="92.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="178.0,94.0 169.1,95.4 171.0,88.3" fill="#1f2a37"/><line x1="112.0" y1="126.0" x2="172.7" y2="115.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="178.0,114.0 170.6,119.1 169.3,111.9" fill="#1f2a37"/><rect x="180.0" y="70.0" width="100.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="230.0" y="94.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">multiply</text><text x="230.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">8 x 8</text><line x1="282.0" y1="98.0" x2="342.6" y2="98.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="348.0,98.0 339.8,101.7 339.8,94.3" fill="#1f2a37"/><text x="315.0" y="88.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">p: 16 bits</text><rect x="350.0" y="70.0" width="110.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="405.0" y="94.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">sign-extend</text><text x="405.0" y="110.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">to 33 bits</text><line x1="462.0" y1="98.0" x2="522.6" y2="98.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="528.0,98.0 519.8,101.7 519.8,94.3" fill="#1f2a37"/><rect x="530.0" y="56.0" width="110.0" height="84.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="585.0" y="94.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">adder</text><text x="585.0" y="111.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">33 bits</text><line x1="642.0" y1="98.0" x2="690.6" y2="98.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="696.0,98.0 687.8,101.7 687.8,94.3" fill="#1f2a37"/><text x="670.0" y="88.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">wide</text><rect x="660.0" y="150.0" width="100.0" height="74.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="710.0" y="174.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">clamp or</text><text x="710.0" y="191.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">wrap?</text><text x="710.0" y="208.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">SAT</text><path d="M710,100 L710,148" fill="none" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710.0,150.0 705.0,140.0 715.0,140.0" fill="#1f2a37"/><line x1="700.0" y1="228.0" x2="700.0" y2="266.6" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="700.0,272.0 696.3,263.8 703.7,263.8" fill="#1f2a37"/><text x="716.0" y="252.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="start" font-style="italic">32 bits</text><rect x="540.0" y="274.0" width="220.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="650.0" y="298.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">accumulator</text><text x="650.0" y="315.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">32 flip-flops</text><path d="M540,302 L500,302 L500,150 L560,150 L560,142" fill="none" stroke="#6b46c1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="560.0,142.0 555.0,152.0 565.0,152.0" fill="#6b46c1"/><text x="430.0" y="232.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b46c1" text-anchor="middle" font-style="italic">acc feeds back:</text><text x="430.0" y="248.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#6b46c1" text-anchor="middle">next = acc + p</text><rect x="120.0" y="250.0" width="270.0" height="100.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="255.0" y="274.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">control, every clock edge:</text><text x="255.0" y="290.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">rst : acc &lt;= 0</text><text x="255.0" y="306.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">clr : acc &lt;= (en ? p : 0)   (new sum)</text><text x="255.0" y="322.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">en  : acc &lt;= acc + p       (accumulate)</text><text x="255.0" y="338.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">else: acc holds</text><text x="60.0" y="376.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#dd6b20" text-anchor="start" font-style="italic">SAT = 0: keep the low 32 bits (wrap)     SAT = 1: clamp to -2^31 .. 2^31-1</text></svg>