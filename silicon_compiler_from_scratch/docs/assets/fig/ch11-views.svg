<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Concatenation costs nothing"><title>Concatenation costs nothing</title><rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">concat_rows(kc, kn) is a view: both parts are written straight into one buffer, no copy instruction</text><rect x="300.0" y="60.0" width="220.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="410.0" y="77.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">row 0  (kc)</text><rect x="300.0" y="90.0" width="220.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="410.0" y="107.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">row 1  (kc)</text><rect x="300.0" y="120.0" width="220.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="410.0" y="137.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">row 2  (kc)</text><rect x="300.0" y="150.0" width="220.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="410.0" y="167.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">row 3  (kc)</text><rect x="300.0" y="180.0" width="220.0" height="26.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="410.0" y="197.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">row 4  (kc)</text><rect x="300.0" y="210.0" width="220.0" height="26.0" rx="3" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="410.0" y="227.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">row 5  (kn)</text><rect x="30.0" y="120.0" width="190.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="125.0" y="141.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">LD kc  (5 x 8)</text><text x="125.0" y="157.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">writes rows 0..4</text><line x1="222.0" y1="145.0" x2="292.9" y2="121.7" stroke="#2b6cb0" stroke-width="2" stroke-linecap="round"/><polygon points="298.0,120.0 291.3,126.1 289.0,119.1" fill="#2b6cb0"/><rect x="30.0" y="200.0" width="190.0" height="50.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="125.0" y="221.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">LD kn  (1 x 8)</text><text x="125.0" y="237.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">writes row 5</text><line x1="222.0" y1="225.0" x2="292.6" y2="215.7" stroke="#dd6b20" stroke-width="2" stroke-linecap="round"/><polygon points="298.0,215.0 290.3,219.7 289.4,212.4" fill="#dd6b20"/><rect x="580.0" y="120.0" width="280.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="720.0" y="144.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">matmul (q K^T) reads the whole</text><text x="720.0" y="159.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">6-row buffer as K</text><text x="720.0" y="174.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(tb = 1: rows are read as columns)</text><line x1="522.0" y1="150.0" x2="572.6" y2="150.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="578.0,150.0 569.8,153.7 569.8,146.3" fill="#1f2a37"/><text x="450.0" y="280.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">Chapter 12 uses exactly this pattern: the KV cache plus the new key and value</text></svg>