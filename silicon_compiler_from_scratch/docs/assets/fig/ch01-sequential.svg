<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="A counter: state register plus next-state logic"><title>A counter: state register plus next-state logic</title><rect x="0.5" y="0.5" width="779" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="390.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A sequential circuit = a register (the state) + combinational logic that computes the next state</text><rect x="230.0" y="80.0" width="250.0" height="120.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="355.0" y="104.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">next-state logic (combinational)</text><text x="355.0" y="132.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle">if rst:   next = 0</text><text x="355.0" y="154.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle">elif en:  next = q + 1</text><text x="355.0" y="176.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle">else:     next = q</text><text x="120.0" y="120.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">en</text><line x1="140.0" y1="116.0" x2="232.6" y2="116.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="238.0,116.0 229.8,119.7 229.8,112.3" fill="#1f2a37"/><text x="120.0" y="170.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">rst</text><line x1="152.0" y1="166.0" x2="232.6" y2="166.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="238.0,166.0 229.8,169.7 229.8,162.3" fill="#1f2a37"/><line x1="472.0" y1="140.0" x2="560.6" y2="140.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="566.0,140.0 557.8,143.7 557.8,136.3" fill="#1f2a37"/><text x="519.0" y="130.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">next q</text><rect x="568.0" y="95.0" width="120.0" height="90.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="628.0" y="135.8" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">register</text><text x="628.0" y="154.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">4 flip-flops</text><line x1="628.0" y1="236.0" x2="628.0" y2="193.4" stroke="#dd6b20" stroke-width="2.4" stroke-linecap="round"/><polygon points="628.0,188.0 631.7,196.2 624.3,196.2" fill="#dd6b20"/><text x="662.0" y="226.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#dd6b20" text-anchor="start" font-weight="bold">clk</text><text x="662.0" y="242.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#dd6b20" text-anchor="start" font-style="italic">(rising edge)</text><path d="M690.0,140.0 L750.0,140.0" fill="none" stroke="#1f2a37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="758.0" y="145.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" fill="#1f2a37" text-anchor="start" font-weight="bold">q</text><path d="M720.0,140.0 L720.0,250.0 L355.0,250.0 L355.0,204.0" fill="none" stroke="#6b46c1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="355.0" y1="220.0" x2="355.0" y2="207.4" stroke="#6b46c1" stroke-width="2.2" stroke-linecap="round"/><polygon points="355.0,202.0 358.7,210.2 351.3,210.2" fill="#6b46c1"/><circle cx="720.0" cy="140.0" r="3.2" fill="#1f2a37"/><text x="540.0" y="272.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6b46c1" text-anchor="middle" font-style="italic">q goes back into the logic: the feedback that gives the circuit a past</text></svg>