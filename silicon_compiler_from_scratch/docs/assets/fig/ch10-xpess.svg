<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="X-pessimism"><title>X-pessimism</title><rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Why a four-state simulator can fail on a netlist that is right: (a &amp; b) | (a &amp; ~b) is just a, but not when b is x</text><rect x="30.0" y="60.0" width="400.0" height="150.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="230.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">what the designer meant</text><text x="50.0" y="112.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">y = (a &amp; b) | (a &amp; ~b)</text><text x="50.0" y="134.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">    = a &amp; (b | ~b)</text><text x="50.0" y="156.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="start">    = a</text><text x="230.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">for a = 1, b = 0 or 1: y = 1</text><rect x="470.0" y="60.0" width="400.0" height="150.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="670.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c53030" text-anchor="middle" font-weight="bold">what a four-state simulator computes</text><text x="490.0" y="112.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="start">a = 1, b = x:</text><text x="490.0" y="133.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="start">  a &amp; b  = 1 &amp; x    = x</text><text x="490.0" y="154.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="start">  a &amp; ~b = 1 &amp; ~x   = x</text><text x="490.0" y="175.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#1f2a37" text-anchor="start">  x | x  =                x</text><text x="670.0" y="196.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="bold">y = x   (silicon would give 1)</text><text x="450.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">The two-valued function is the same, so the optimizer was free to rearrange it. Unreset flip-flops hold x in simulation, and the rearranged logic</text><text x="450.0" y="268.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">lets an x leak where the original did not. Fixes: reset everything (costs area) or start gate-level simulation from a defined state.</text></svg>