<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Sequencer states"><title>Sequencer states</title><rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Every instruction: FETCH (1 cycle), ISSUE (1 cycle), then WAIT until the unit is done</text><rect x="20.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="85.0" y="103.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">IDLE</text><text x="85.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">start = 0</text><line x1="152.0" y1="98.0" x2="186.6" y2="98.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="192.0,98.0 183.8,101.7 183.8,94.3" fill="#1f2a37"/><rect x="195.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="260.0" y="103.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">FETCH</text><text x="260.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">read imem[pc]</text><text x="260.0" y="162.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">1 cycle</text><line x1="327.0" y1="98.0" x2="361.6" y2="98.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="367.0,98.0 358.8,101.7 358.8,94.3" fill="#1f2a37"/><rect x="370.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="435.0" y="103.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">ISSUE</text><text x="435.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">pulse start to the</text><text x="435.0" y="162.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">unit named by op</text><text x="435.0" y="176.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">1 cycle</text><line x1="502.0" y1="98.0" x2="536.6" y2="98.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="542.0,98.0 533.8,101.7 533.8,94.3" fill="#1f2a37"/><rect x="545.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="610.0" y="103.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">WAIT</text><text x="610.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">until unit_done</text><text x="610.0" y="162.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">busy cycles</text><line x1="677.0" y1="98.0" x2="711.6" y2="98.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="717.0,98.0 708.8,101.7 708.8,94.3" fill="#1f2a37"/><rect x="720.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="785.0" y="103.2" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2a37" text-anchor="middle" font-weight="bold">HALT</text><text x="785.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">op = 0:</text><text x="785.0" y="162.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">halted = 1</text><path d="M610,70 C610,36 255,36 255,68" fill="none" stroke="#2f855a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><polygon points="255.0,70.0 250.0,60.0 260.0,60.0" fill="#2f855a"/><text x="432.0" y="55.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#2f855a" text-anchor="middle" font-weight="bold">unit_done: pc + 1, next fetch</text><path d="M440,128 C440,210 835,210 835,128" fill="none" stroke="#c53030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640.0" y="224.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#c53030" text-anchor="middle" font-weight="bold">op == HALT (issue)</text><text x="450.0" y="260.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">total cycles of a program = sum over instructions of (2 + busy time of the unit) + 2 for the final HALT</text><text x="450.0" y="278.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">(the counters cyc_total, cyc_mm, cyc_dma, cyc_vec and n_inst record exactly this)</text></svg>