0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="158.0" y="153.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">4x4</text><rect x="238.0" y="68.0" width="161.0" height="161.0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="318.0" y="153.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">4x4</text><rect x="398.0" y="68.0" width="81.0" height="161.0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="438.0" y="153.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">4x2</text><rect x="78.0" y="228.0" width="161.0" height="41.0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="158.0" y="253.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">1x4</text><rect x="238.0" y="228.0" width="161.0" height="41.0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="318.0" y="253.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">1x4</text><rect x="398.0" y="228.0" width="81.0" height="41.0" rx="4" fill="none" stroke="#1f2a37" stroke-width="2.2"/><text x="438.0" y="253.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">1x2</text><text x="279.0" y="58.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">C (5 x 10): output columns</text><text x="50.0" y="170.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" transform="rotate(-90 50.0 170.0)">rows</text><text x="560.0" y="110.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">6 tiles: 4x4, 4x4, 4x2 (top row of tiles)</text><text x="560.0" y="127.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">           1x4, 1x4, 1x2 (the last row)</text><text x="560.0" y="144.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start"></text><text x="560.0" y="161.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">each tile is ONE  MM  instruction:</text><text x="560.0" y="178.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">  M = tile rows, N = tile columns, K = 12</text><text x="560.0" y="195.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">  A advances by tile-rows x lda,</text><text x="560.0" y="212.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">  B advances by tile-columns,</text><text x="560.0" y="229.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">  C by the same offsets with ldc = 10</text><text x="560.0" y="246.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start"></text><text x="560.0" y="263.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">the strides let one instruction work</text><text x="560.0" y="280.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">on a piece of a bigger matrix in place,</text><text x="560.0" y="297.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="start">with no copying</text></svg>