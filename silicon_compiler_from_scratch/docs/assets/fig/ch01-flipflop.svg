 fill="#51606f" text-anchor="middle">q at an edge = the value d had JUST BEFORE that edge.  Between edges, changes of d are ignored.</text><text x="390.0" y="307.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle">That is what makes a clocked design predictable: everything updates together, on the edge.</text></svg>