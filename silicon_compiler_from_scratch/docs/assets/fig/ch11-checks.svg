<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="How the compiler is tested"><title>How the compiler is tested</title><rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Five checks on every random graph, each catching what the others cannot</text><rect x="14.0" y="56.0" width="170.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="99.0" y="87.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(a) allocator</text><text x="99.0" y="132.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">compile with and without</text><text x="99.0" y="146.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">buffer reuse: same outputs</text><rect x="198.0" y="56.0" width="170.0" height="54.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="283.0" y="87.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(b) meaning</text><text x="283.0" y="132.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">simulator = integer</text><text x="283.0" y="146.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">interpreter, exactly</text><rect x="382.0" y="56.0" width="170.0" height="54.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="467.0" y="87.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(c) every tensor</text><text x="467.0" y="132.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">reuse off: each tensor</text><text x="467.0" y="146.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">equals the interpreter's</text><rect x="566.0" y="56.0" width="170.0" height="54.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="651.0" y="87.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(d) scales</text><text x="651.0" y="132.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">each tensor within one level</text><text x="651.0" y="146.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">of its real-number meaning</text><rect x="750.0" y="56.0" width="170.0" height="54.0" rx="8" fill="#b2f5ea" stroke="#2c7a7b" stroke-width="1.8"/><text x="835.0" y="87.7" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">(e) accuracy</text><text x="835.0" y="132.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">within 0.16 of floating</text><text x="835.0" y="146.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">point on unseen inputs</text><rect x="14.0" y="190.0" width="910.0" height="110.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="30.0" y="214.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">plus two more: check_errors (five graphs the compiler must REFUSE, so removing a safety check is detected)</text><text x="30.0" y="233.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">and check_cancellation (one directed graph: add(x, y) with y near -x, which random graphs almost never contain).</text><text x="30.0" y="252.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start"></text><text x="30.0" y="271.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">27 deliberately broken compilers (the mutation run) are all caught by at least one check.</text></svg>