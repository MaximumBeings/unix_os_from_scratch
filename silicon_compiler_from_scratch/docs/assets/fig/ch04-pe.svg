<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-label="One processing element"><title>One processing element</title><rect x="0.5" y="0.5" width="779" height="339" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="390.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A PE: a MAC plus two pass-through registers</text><rect x="250.0" y="100.0" width="290.0" height="140.0" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2"/><text x="395.0" y="120.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">PE(i, j)</text><rect x="275.0" y="138.0" width="90.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="320.0" y="162.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">a x b</text><rect x="405.0" y="138.0" width="110.0" height="40.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="460.0" y="162.6" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#1f2a37" text-anchor="middle" font-weight="bold">+ acc</text><line x1="367.0" y1="158.0" x2="397.6" y2="158.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="403.0,158.0 394.8,161.7 394.8,154.3" fill="#1f2a37"/><rect x="405.0" y="192.0" width="110.0" height="36.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="460.0" y="214.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">acc (32 bit)</text><line x1="460.0" y1="180.0" x2="460.0" y2="184.6" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="460.0,190.0 456.3,181.8 463.7,181.8" fill="#1f2a37"/><path d="M515,210 L528,210 L528,158 L517,158" fill="none" stroke="#2f855a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="530.0" y="252.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#2f855a" text-anchor="end" font-style="italic">acc feeds back into the +</text><text x="60.0" y="154.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">a_in</text><line x1="92.0" y1="158.0" x2="267.6" y2="158.0" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="273.0,158.0 264.8,161.7 264.8,154.3" fill="#1f2a37"/><text x="320.0" y="44.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">b_in</text><line x1="320.0" y1="52.0" x2="320.0" y2="130.6" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="320.0,136.0 316.3,127.8 323.7,127.8" fill="#1f2a37"/><circle cx="200.0" cy="158.0" r="3.5" fill="#1f2a37"/><path d="M200,158 L200,262" fill="none" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="170.0" y="262.0" width="70.0" height="30.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="205.0" y="281.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">a reg</text><line x1="242.0" y1="277.0" x2="734.6" y2="277.0" stroke="#dd6b20" stroke-width="2.2" stroke-linecap="round"/><polygon points="740.0,277.0 731.8,280.7 731.8,273.3" fill="#dd6b20"/><text x="430.0" y="306.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#dd6b20" text-anchor="middle" font-weight="bold">a_out -&gt; PE(i, j+1)  (the PE to the right)</text><circle cx="320.0" cy="80.0" r="3.5" fill="#1f2a37"/><path d="M320,80 L600,80" fill="none" stroke="#dd6b20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="600.0" y="64.0" width="70.0" height="30.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="635.0" y="83.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1f2a37" text-anchor="middle" font-weight="bold">b reg</text><line x1="635.0" y1="96.0" x2="635.0" y2="144.6" stroke="#dd6b20" stroke-width="2.2" stroke-linecap="round"/><polygon points="635.0,150.0 631.3,141.8 638.7,141.8" fill="#dd6b20"/><text x="635.0" y="168.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#dd6b20" text-anchor="middle" font-weight="bold">b_out -&gt; PE(i+1, j)</text><text x="635.0" y="184.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">(the PE below)</text><text x="110.0" y="220.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">every clock edge:</text><text x="110.0" y="235.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">acc &lt;= acc + a_in * b_in</text><text x="110.0" y="250.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">a_out &lt;= a_in</text><text x="110.0" y="265.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">b_out &lt;= b_in</text></svg>