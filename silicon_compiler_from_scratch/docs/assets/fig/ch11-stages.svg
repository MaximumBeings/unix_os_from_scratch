<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Capra's stages"><title>Capra's stages</title><rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Capra: a graph of tensor operations in, a GA-2 program out</text><rect x="14.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="83.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">graph</text><text x="83.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">(floats)</text><line x1="154.0" y1="83.0" x2="160.6" y2="83.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="166.0,83.0 157.8,86.7 157.8,79.3" fill="#1f2a37"/><rect x="168.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="237.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">calibrate</text><text x="237.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">run on samples,</text><text x="237.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">record ranges</text><line x1="308.0" y1="83.0" x2="314.6" y2="83.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="320.0,83.0 311.8,86.7 311.8,79.3" fill="#1f2a37"/><rect x="322.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="391.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">plan scales</text><text x="391.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">int8 scale per tensor,</text><text x="391.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">mantissa + shift</text><line x1="462.0" y1="83.0" x2="468.6" y2="83.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="474.0,83.0 465.8,86.7 465.8,79.3" fill="#1f2a37"/><rect x="476.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="545.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">tile</text><text x="545.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">matmul -&gt; 4x4 MM</text><text x="545.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">instructions</text><line x1="616.0" y1="83.0" x2="622.6" y2="83.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="628.0,83.0 619.8,86.7 619.8,79.3" fill="#1f2a37"/><rect x="630.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="699.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">allocate</text><text x="699.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">scratchpad address,</text><text x="699.0" y="148.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">reuse dead space</text><line x1="770.0" y1="83.0" x2="776.6" y2="83.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="782.0,83.0 773.8,86.7 773.8,79.3" fill="#1f2a37"/><rect x="784.0" y="56.0" width="138.0" height="54.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="853.0" y="87.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">emit</text><text x="853.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">LD MM RQ SM ... HALT</text><rect x="14.0" y="190.0" width="450.0" height="110.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="240.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">decisions the user never makes</text><text x="30.0" y="236.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- the int8 scale of every tensor</text><text x="30.0" y="253.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- every requantizer's multiplier and shift</text><text x="30.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- how a big product is cut into 4x4 tiles</text><text x="30.0" y="287.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- where each tensor lives, and when its space is reused</text><rect x="490.0" y="190.0" width="436.0" height="110.0" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-width="1.8"/><text x="708.0" y="212.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#c53030" text-anchor="middle" font-weight="bold">limits the compiler enforces</text><text x="506.0" y="236.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- inner dimension K &lt;= 64 (no int32-accumulate instruction)</text><text x="506.0" y="253.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- 4,096 words of scratchpad, int8 tensors</text><text x="506.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- a relu must fuse into the matmul before it</text><text x="506.0" y="287.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="start">- a tensor cannot feed two concatenations</text></svg>