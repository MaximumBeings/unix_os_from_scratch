<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Inside one MM"><title>Inside one MM</title><rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">MM for M=2, K=3, N=2: 28 cycles, of which the array itself computes 5</text><rect x="50.0" y="60.0" width="171.4" height="56.0" rx="3" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="135.7" y="93.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="bold">6</text><text x="135.7" y="138.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">stage A</text><rect x="221.4" y="60.0" width="171.4" height="56.0" rx="3" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="307.1" y="93.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="bold">6</text><text x="307.1" y="138.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">stage B</text><rect x="392.9" y="60.0" width="142.9" height="56.0" rx="3" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="464.3" y="93.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="bold">5</text><text x="464.3" y="138.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">stream through the array</text><rect x="535.7" y="60.0" width="114.3" height="56.0" rx="3" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="592.9" y="93.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="bold">4</text><text x="592.9" y="138.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">write C</text><rect x="650.0" y="60.0" width="200.0" height="56.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="750.0" y="93.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="bold">7</text><text x="750.0" y="138.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle">control</text><text x="450.0" y="190.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">staging = M*K + K*N  (copy the two tiles into the operand memories, one scratchpad word per cycle)</text><text x="450.0" y="209.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">streaming = K+M+N-2  (the skewed schedule of Chapter 4, here for an M x N array region)</text><text x="450.0" y="228.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="middle">writing = M*N  (one result word per cycle back to the scratchpad)</text><text x="450.0" y="270.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-style="italic">most of the time is moving data, not multiplying: for large tiles the staging dominates, and this is what Chapter 9's bandwidth analysis measures</text></svg>