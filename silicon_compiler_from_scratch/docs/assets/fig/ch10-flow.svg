<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="The synthesis flow"><title>The synthesis flow</title><rect x="0.5" y="0.5" width="939" height="299" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">Verilog to a netlist of library cells: the steps Yosys and ABC run</text><rect x="14.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="83.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">RTL</text><text x="83.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">rtl/*.v</text><line x1="154.0" y1="92.0" x2="160.6" y2="92.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="166.0,92.0 157.8,95.7 157.8,88.3" fill="#1f2a37"/><rect x="168.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="237.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">elaborate</text><text x="237.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">registers + logic</text><line x1="308.0" y1="92.0" x2="314.6" y2="92.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="320.0,92.0 311.8,95.7 311.8,88.3" fill="#1f2a37"/><rect x="322.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="391.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">optimize</text><text x="391.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">simplify, share, flatten</text><line x1="462.0" y1="92.0" x2="468.6" y2="92.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="474.0,92.0 465.8,95.7 465.8,88.3" fill="#1f2a37"/><rect x="476.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="545.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">map</text><text x="545.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">ABC picks cells from toy.lib</text><line x1="616.0" y1="92.0" x2="622.6" y2="92.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="628.0,92.0 619.8,95.7 619.8,88.3" fill="#1f2a37"/><rect x="630.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="699.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">netlist</text><text x="699.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">out/*_net.v, .json</text><line x1="770.0" y1="92.0" x2="776.6" y2="92.0" stroke="#1f2a37" stroke-width="2" stroke-linecap="round"/><polygon points="782.0,92.0 773.8,95.7 773.8,88.3" fill="#1f2a37"/><rect x="784.0" y="60.0" width="138.0" height="64.0" rx="8" fill="#e9d8fd" stroke="#6b46c1" stroke-width="1.8"/><text x="853.0" y="89.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">analyze</text><text x="853.0" y="115.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">area, timing, simulate</text><rect x="404.0" y="160.0" width="140.0" height="44.0" rx="8" fill="#fefcbf" stroke="#a0aec0" stroke-width="1.8"/><text x="474.0" y="178.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">toy.lib: 14 cells</text><text x="474.0" y="193.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">area + delay each</text><line x1="474.0" y1="160.0" x2="474.0" y2="130.8" stroke="#a0aec0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3"/><polygon points="474.0,126.0 477.3,133.3 470.7,133.3" fill="#a0aec0"/><rect x="14.0" y="160.0" width="250.0" height="52.0" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.8"/><text x="139.0" y="182.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">memories stay black boxes</text><text x="139.0" y="197.5" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#1f2a37" text-anchor="middle">(a chip uses a memory macro)</text><text x="470.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">Every step preserves the function. The next sections check that it did, three ways:</text><text x="470.0" y="269.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle">gate-level simulation, fault grading, and equivalence checking.</text></svg>