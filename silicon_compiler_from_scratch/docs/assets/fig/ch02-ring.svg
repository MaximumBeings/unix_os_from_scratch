<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="The two's-complement ring (4 bits)"><title>The two's-complement ring (4 bits)</title><rect x="0.5" y="0.5" width="559" height="459" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="280.0" y="24.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">A 4-bit number is a position on a ring of 16: going past +7 lands on -8</text><circle cx="280.0" cy="235.0" r="150.0" fill="none" stroke="#a0aec0" stroke-width="2"/><circle cx="280.0" cy="85.0" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="280.0" y="90.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">0</text><text x="280.0" y="135.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0000</text><circle cx="337.4" cy="96.4" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="337.4" y="101.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">1</text><text x="319.8" y="142.9" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0001</text><circle cx="386.1" cy="128.9" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="386.1" y="133.9" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">2</text><text x="353.5" y="165.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0010</text><circle cx="418.6" cy="177.6" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="418.6" y="182.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">3</text><text x="376.1" y="199.2" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0011</text><circle cx="430.0" cy="235.0" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="430.0" y="240.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">4</text><text x="384.0" y="239.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0100</text><circle cx="418.6" cy="292.4" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="418.6" y="297.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">5</text><text x="376.1" y="278.8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0101</text><circle cx="386.1" cy="341.1" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="386.1" y="346.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">6</text><text x="353.5" y="312.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0110</text><circle cx="337.4" cy="373.6" r="19.0" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="337.4" y="378.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">7</text><text x="319.8" y="335.1" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">0111</text><circle cx="280.0" cy="385.0" r="19.0" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="280.0" y="390.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">-8</text><text x="280.0" y="343.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1000</text><circle cx="222.6" cy="373.6" r="19.0" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="222.6" y="378.6" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">-7</text><text x="240.2" y="335.1" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1001</text><circle cx="173.9" cy="341.1" r="19.0" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="173.9" y="346.1" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">-6</text><text x="206.5" y="312.5" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1010</text><circle cx="141.4" cy="292.4" r="19.0" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="141.4" y="297.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">-5</text><text x="183.9" y="278.8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1011</text><circle cx="130.0" cy="235.0" r="19.0" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="130.0" y="240.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">-4</text><text x="176.0" y="239.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#51606f" text-anchor="middle">1100</text><circle cx="141.4" cy="177.6" r="19.0" fill="#fed7d7" stroke=