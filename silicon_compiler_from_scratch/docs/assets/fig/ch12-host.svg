<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="Host and chip"><title>Host and chip</title><rect x="0.5" y="0.5" width="939" height="359" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="470.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">One generated token: what the host does and what the chip does</text><rect x="20.0" y="60.0" width="400.0" height="250.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="220.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#dd6b20" text-anchor="middle" font-weight="bold">HOST (a Python program)</text><text x="40.0" y="112.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">1. pick the embedding row of the input token</text><text x="40.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">   (the chip has no gather instruction)</text><text x="40.0" y="156.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">2. keep the KV cache between steps</text><text x="40.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">3. load the compiled program for this context length</text><text x="40.0" y="200.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">4. read back: token, logits, new k and new v</text><text x="40.0" y="222.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">5. append k and v to the cache; feed the token back</text><rect x="520.0" y="60.0" width="400.0" height="250.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="720.0" y="84.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">CHIP (GA-2 running a Capra program)</text><text x="540.0" y="112.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">x -&gt; q, k, v           (3 projections)</text><text x="540.0" y="134.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">append k, v to the cache views</text><text x="540.0" y="156.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">scores, softmax, weighted sum</text><text x="540.0" y="178.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">output projection + residual add</text><text x="540.0" y="200.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">feed-forward (two matmuls, relu) + residual add</text><text x="540.0" y="222.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1f2a37" text-anchor="start">final projection to 16 logits -&gt; argmax</text><line x1="422.0" y1="150.0" x2="512.6" y2="150.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="518.0,150.0 509.8,153.7 509.8,146.3" fill="#1f2a37"/><text x="470.0" y="140.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">x, cache</text><line x1="518.0" y1="230.0" x2="427.4" y2="230.0" stroke="#1f2a37" stroke-width="2.4" stroke-linecap="round"/><polygon points="422.0,230.0 430.2,226.3 430.2,233.7" fill="#1f2a37"/><text x="470.0" y="250.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#51606f" text-anchor="middle" font-style="italic">token, k, v</text><text x="470.0" y="340.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">24 steps, each a separately compiled program (one per context length), each replayed on the RTL in both simulators</text></svg>