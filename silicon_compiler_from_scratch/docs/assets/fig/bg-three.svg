<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="One function, three descriptions"><title>One function, three descriptions</title><rect x="0.5" y="0.5" width="899" height="329" rx="10" fill="#fbfcfe" stroke="#d5dbe3"/><text x="450.0" y="22.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="bold">The majority-of-three function written three ways: Yosys turns all of them into the same kind of gates</text><rect x="20.0" y="50.0" width="276.0" height="150.0" rx="8" fill="#dbeafe" stroke="#2b6cb0" stroke-width="1.8"/><text x="158.0" y="72.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="bold">assign (dataflow)</text><text x="36.0" y="98.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">assign y = (a &amp; b)</text><text x="36.0" y="115.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">         | (a &amp; c) | (b &amp; c);</text><rect x="312.0" y="50.0" width="276.0" height="150.0" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.8"/><text x="450.0" y="72.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#2f855a" text-anchor="middle" font-weight="bold">always + case (behaviour)</text><text x="328.0" y="98.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">always @* case ({a,b,c})</text><text x="328.0" y="115.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">  3'b011,3'b101,</text><text x="328.0" y="132.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">  3'b110,3'b111: y = 1;</text><text x="328.0" y="149.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">  default: y = 0;</text><text x="328.0" y="166.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">endcase</text><rect x="604.0" y="50.0" width="276.0" height="150.0" rx="8" fill="#feebc8" stroke="#dd6b20" stroke-width="1.8"/><text x="742.0" y="72.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#dd6b20" text-anchor="middle" font-weight="bold">gates (structure)</text><text x="620.0" y="98.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">and g1(ab,a,b);</text><text x="620.0" y="115.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">and g2(ac,a,c);</text><text x="620.0" y="132.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">and g3(bc,b,c);</text><text x="620.0" y="149.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1f2a37" text-anchor="start">or  g4(y,ab,ac,bc);</text><line x1="450.0" y1="204.0" x2="450.0" y2="232.6" stroke="#1f2a37" stroke-width="2.2" stroke-linecap="round"/><polygon points="450.0,238.0 446.3,229.8 453.7,229.8" fill="#1f2a37"/><rect x="300.0" y="240.0" width="300.0" height="40.0" rx="8" fill="#fed7d7" stroke="#c53030" stroke-width="1.8"/><text x="450.0" y="264.4" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2a37" text-anchor="middle" font-weight="bold">Yosys: 5 cells (3 AND, 2 OR)  or  4 with NAND</text><text x="450.0" y="312.0" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#51606f" text-anchor="middle" font-style="italic">same truth table, same circuit: the style is a matter of readability, not of what hardware you get</text></svg>