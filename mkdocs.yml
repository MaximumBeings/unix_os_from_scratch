site_name: Unix OS from Scratch -- A Bare-Metal x86-64 Kernel Built From Nothing -- Under Development
site_description: A Unix-Like Operating System in C, From Power-On to a Working Shell
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/console

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 1 -- Booting: From Power-On to Kernel Entry":
      - "1. Booting a Multiboot2 Kernel": part1/01-booting-a-multiboot2-kernel-from-power-on-to-kernel-entry.md
  - "Part 2 -- Talking to Hardware: Early Device Drivers":
      - "2. VGA Text-Mode Output": part2/02-vga-text-mode-output-a-real-screen-driver.md
  - "Part 3 -- Kernel Infrastructure: Descriptor Tables and Utilities":
      - "3. A Real GDT and a Kernel printf": part3/03-a-real-gdt-and-a-kernel-printf.md
      - "4. Interrupts: The IDT and a First Real ISR": part4/04-interrupts-the-idt-and-a-first-real-isr.md
  - "Part 4 -- Hardware Interrupts: Making the Kernel Interactive":
      - "5. PS/2 Keyboard Input, via a Real Hardware IRQ": part5/05-ps2-keyboard-input-via-a-real-hardware-irq.md
      - "6. The PIT Timer and a Real Tick Counter": part6/06-the-pit-timer-and-a-real-tick-counter.md

extra:
  social: []
