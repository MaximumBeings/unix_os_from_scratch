      - "13. Synchronization Primitives: Spinlocks": part13/13-synchronization-primitives-spinlocks.md
      - "14. Blocking Synchronization: Semaphores and Sleep/Wake": part14/14-blocking-synchronization-semaphores-and-sleep-wake.md
  - "Part 7 -- Privilege: Running Code This Kernel Does Not Fully Trust":
      - "15. User Mode: Ring 3, a TSS, and a First System Call": part15/15-user-mode-ring-3-tss-and-a-first-system-call.md
      - "16. Real Ring-3 Tasks in the Scheduler: sys_yield, sys_exit, Multiple User Tasks": part16/16-real-ring-3-tasks-in-the-scheduler.md
      - "17. Per-Process Address Spaces: One Page Directory Per Task": part17/17-per-process-address-spaces.md
      - "18. Loading a Real ELF Binary: Parsing Program Headers and Mapping PT_LOAD Segments": part18/18-loading-a-real-elf-binary.md
      - "19. A Real Disk Driver: ATA PIO Mode, Reading and Writing Real Sectors": part19/19-a-real-disk-driver-ata-pio-mode.md
      - "20. A Real Filesystem: FAT16, Files Addressed by Name Instead of by Raw LBA": part20/20-a-real-filesystem-fat16.md
