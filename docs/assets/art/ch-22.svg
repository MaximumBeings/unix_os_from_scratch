<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">An empty folder crossed out: removing a directory</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10261c"/><stop offset="1" stop-color="#1d4a37"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6f6ee" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><path d="M110,98 h57.0 l8,-8 h85.0 v110 h-150 z" fill="#ffd166" stroke="#08150f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="185.0" y="153.0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#08150f" text-anchor="middle" font-weight="bold">EMPTY</text><line x1="300" y1="100" x2="380" y2="190" stroke="#e6f6ee" stroke-width="12" stroke-linecap="round"/><line x1="380" y1="100" x2="300" y2="190" stroke="#e6f6ee" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="100" x2="380" y2="190" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/><line x1="380" y1="100" x2="300" y2="190" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/><text x="580" y="120" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="28" fill="#ffd166" text-anchor="middle" font-weight="bold">rmdir()</text><text x="580" y="160" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#e6f6ee" text-anchor="middle">only if empty</text><text x="580" y="195" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#52b788" text-anchor="middle">'.' and '..' only</text></svg>
