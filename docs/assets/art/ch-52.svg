<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">A pay stub with gross pay at the top and federal tax, Social Security and Medicare slices taken out, leaving net pay, beside a wage-base bar that fills and stops</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13200f"/><stop offset="1" stop-color="#27471d"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#f5fbe8" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><rect x="70" y="36" width="330" height="250" rx="10" fill="#f5fbe8" stroke="#0a1207" stroke-width="3"/><text x="235" y="62" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0a1207" text-anchor="middle" font-weight="bold">PAY STUB</text><text x="88" y="94" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#0a1207" text-anchor="start" font-weight="bold">Gross pay</text><text x="384" y="94" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#0a1207" text-anchor="end" font-weight="bold">2,000.00</text><text x="88" y="124" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="bold">Federal income tax</text><text x="384" y="124" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="end" font-weight="bold">- 161.60</text><text x="88" y="154" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="bold">Social Security 6.2%</text><text x="384" y="154" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="end" font-weight="bold">- 124.00</text><text x="88" y="184" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="bold">Medicare 1.45%</text><text x="384" y="184" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#fbbf24" text-anchor="end" font-weight="bold">- 29.00</text><path d="M86,198 L384,198" fill="none" stroke="#0a1207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="86" y="214" width="298" height="50" rx="8" fill="#a3e635" stroke="#0a1207" stroke-width="3"/><text x="100" y="246" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#0a1207" text-anchor="start" font-weight="bold">NET PAY</text><text x="370" y="246" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#0a1207" text-anchor="end" font-weight="bold">1,685.40</text><text x="600" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#f5fbe8" text-anchor="middle" font-weight="bold">Social Security wage base</text><rect x="450" y="74" width="300" height="34" rx="6" fill="#0a1207" stroke="#f5fbe8" stroke-width="2"/><rect x="450" y="74" width="240" height="34" rx="6" fill="#a3e635" stroke="#0a1207" stroke-width="2"/><path d="M690,64 L690,120" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="140" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">$176,100: tax stops here</text><text x="450" y="190" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#a3e635" text-anchor="start" font-weight="bold">period 1-22: 6.2% each pay</text><text x="450" y="216" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#f5fbe8" text-anchor="start" font-weight="bold">period 23: only the last dollars</text><text x="450" y="242" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="bold">period 24+: Social Security $0</text><text x="600" y="280" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f5fbe8" text-anchor="middle" opacity="0.9">Additional Medicare 0.9% above $200,000</text></svg>
