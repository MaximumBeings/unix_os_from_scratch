<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">x86 registers, assembly instructions and the machine code they become</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#44403c"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#faf5eb" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><rect x="80" y="60" width="150" height="50" rx="6" fill="#0f0d0c" stroke="#fbbf24" stroke-width="3"/><text x="155" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">RAX</text><rect x="255" y="60" width="150" height="50" rx="6" fill="#0f0d0c" stroke="#fbbf24" stroke-width="3"/><text x="330" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">RBX</text><rect x="430" y="60" width="150" height="50" rx="6" fill="#0f0d0c" stroke="#fbbf24" stroke-width="3"/><text x="505" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">RCX</text><rect x="605" y="60" width="150" height="50" rx="6" fill="#0f0d0c" stroke="#fbbf24" stroke-width="3"/><text x="680" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">RDX</text><text x="80" y="175" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#faf5eb" text-anchor="start">mov rax, 5</text><text x="80" y="210" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#faf5eb" text-anchor="start">add rax, rbx</text><text x="80" y="245" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#faf5eb" text-anchor=