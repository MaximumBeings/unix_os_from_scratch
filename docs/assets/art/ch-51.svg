<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">A limit order book with bids and asks, a trade where they meet, and the feed of messages a matching engine publishes</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a2a"/><stop offset="1" stop-color="#173a5e"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e8f1fb" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><text x="210" y="50" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="bold">BIDS (buyers)</text><text x="500" y="50" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#f87171" text-anchor="middle" font-weight="bold">ASKS (sellers)</text><rect x="150" y="76" width="120" height="28" rx="4" fill="#4ade80" stroke="#060e17" stroke-width="2" opacity="0.9"/><text x="278" y="95" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#e8f1fb" text-anchor="start" font-weight="bold">100.01</text><text x="156" y="95" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#060e17" text-anchor="start" font-weight="bold">120</text><rect x="180" y="114" width="90" height="28" rx="4" fill="#4ade80" stroke="#060e17" stroke-width="2" opacity="0.9"/><text x="278" y="133" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#e8f1fb" text-anchor="start" font-weight="bold">100.00</text><text x="186" y="133" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#060e17" text-anchor="start" font-weight="bold">90</text><rect x="110" y="152" width="160" height="28" rx="4" fill="#4ade80" stroke="#060e17" stroke-width="2" opacity="0.9"/><text x="278" y="171" font-family="ui-monospace,Menlo,Consolas,monospace" font