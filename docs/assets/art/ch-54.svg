<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t"><title id="t">A client and a server exchanging a TLS 1.3 handshake, with a padlock over the encrypted messages and a chain of three secrets that become the traffic keys</title><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b1a"/><stop offset="1" stop-color="#12423c"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e9fbf8" opacity=".14"/></pattern></defs><rect width="800" height="300" fill="url(#bg)"/><rect width="800" height="300" fill="url(#dots)"/><rect x="50" y="34" width="110" height="176" rx="10" fill="#e9fbf8" stroke="#06100f" stroke-width="3"/><text x="105" y="60" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#06100f" text-anchor="middle" font-weight="bold">CLIENT</text><rect x="640" y="34" width="110" height="176" rx="10" fill="#e9fbf8" stroke="#06100f" stroke-width="3"/><text x="695" y="60" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#06100f" text-anchor="middle" font-weight="bold">SERVER</text><path d="M170,56 L630,56 M630,56 l-8,-4 m8,4 l-8,4" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="bold">ClientHello + key share</text><path d="M630,76 L170,76 M170,76 l8,-4 m-8,4 l8,4" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="72" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#2dd4bf" text-anchor="middle" font-weight="bold">ServerHello + key share</text><path d="M630,96 L170,96 M170,96 l8,-4 m-8,4 l8,4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">{EncryptedExtensions}</text><path d="M630,116 L170,116 M170,116 l8,-4 m-8,4 l8,4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="112" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">{Certificate}</text><path d="M630,136 L170,136 M170,136 l8,-4 m-8,4 l8,4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="132" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">{CertificateVerify}</text><path d="M630,156 L170,156 M170,156 l8,-4 m-8,4 l8,4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="152" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">{Finished}</text><path d="M170,176 L630,176 M630,176 l-8,-4 m8,4 l-8,4" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="172" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">{Finished}</text><path d="M170,196 L630,196 M630,196 l-8,-4 m8,4 l-8,4" fill="none" stroke="#e9fbf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,196 l8,-4 m-8,4 l8,4" fill="none" stroke="#e9fbf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="192" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e9fbf8" text-anchor="middle" font-weight="bold">application data</text><rect x="290" y="80" width="220" height="84" rx="8" fill="none" stroke="#f472b6" stroke-width="2" opacity="0.9"/><text x="400" y="211" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">boxed: encrypted with the handshake keys</text><rect x="190" y="224" width="120" height="30" rx="6" fill="#06100f" stroke="#2dd4bf" stroke-width="2"/><text x="250" y="244" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#e9fbf8" text-anchor="middle" font-weight="bold">Early secret</text><rect x="330" y="224" width="120" height="30" rx="6" fill="#06100f" stroke="#2dd4bf" stroke-width="2"/><text x="390" y="244" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#e9fbf8" text-anchor="middle" font-weight="bold">Handshake secret</text><rect x="470" y="224" width="120" height="30" rx="6" fill="#06100f" stroke="#2dd4bf" stroke-width="2"/><text x="530" y="244" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#e9fbf8" text-anchor="middle" font-weight="bold">Master secret</text><path d="M312,239 L328,239 m-7,-4 l7,4 l-7,4 M452,239 L468,239 m-7,-4 l7,4 l-7,4" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="278" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#e9fbf8" text-anchor="middle" opacity="0.9">HKDF chain: each step mixes in the key share, then the transcript hash</text></svg>
